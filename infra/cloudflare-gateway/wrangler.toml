name = "incubar-reporting-gateway"
main = "src/index.ts"
compatibility_date = "2026-02-07"
compatibility_flags = ["nodejs_compat"]

[[kv_namespaces]]
binding = "TENANT_KEYS"
id = "5906dd82f8c547b4bd1c8713d34f3edb"

[[d1_databases]]
binding = "AUTH_DB"
database_name = "incubar-auth"
database_id = "dc668fe4-be80-459e-9be0-c17f17bd06c8"

[vars]
TINYBIRD_HOST = "https://api.europe-west2.gcp.tinybird.co"
TINYBIRD_DATASOURCE = "incubar_usage_events"
AUTH_BASE_URL = "https://incubar-reporting-gateway.alvaro-112.workers.dev"
AUTH_TRUSTED_ORIGINS = "https://incubar-employer-dashboard.pages.dev,https://dev.incubar-employer-dashboard.pages.dev"
